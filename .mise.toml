# mise configuration for the Modules monorepo.
# mise is the PRIMARY tooling — run `mise run <task>`. It pins tool versions,
# sets env, and delegates to Nx/pnpm so every contributor + CI stays aligned.
# Install mise: https://mise.jdx.dev/getting-started.html

[tools]
node = "24.21.0"
# pnpm via the npm backend — the default (aqua) backend has a macOS asset-naming
# mismatch for pnpm 12.x (looks for pnpm-macos-arm64, registry ships pnpm-darwin-arm64).
"npm:pnpm" = "12.8.2"
"npm:nx" = "23.2.1"

[env]
ASTRO_TELEMETRY_DISABLED = "true"
_.path = ["{{config_root}}/node_modules/.bin"]

# ============================================================================

[tasks.info]
description = "Show available tasks"
run = '''
BOLD="\033[1m"; RESET="\033[0m"; CYAN="\033[36m"; GREEN="\033[32m"; YELLOW="\033[33m"; DIM="\033[2m"
printf "\n${CYAN}${BOLD}── SETUP ───────────────────────────────${RESET}\n"
printf "  ${GREEN}setup${RESET}            ${DIM}install all dependencies${RESET}\n"
printf "  ${GREEN}setup-agent-skills${RESET} ${DIM}(optional) recommended AI agent skills${RESET}\n"
printf "\n${YELLOW}${BOLD}── DAILY (optionally pass a service) ───${RESET}\n"
printf "  ${GREEN}dev [svc]${RESET}        ${DIM}start dev servers (all, or one)${RESET}\n"
printf "  ${GREEN}build [svc]${RESET}      ${DIM}build all services (or one)${RESET}\n"
printf "  ${GREEN}lint [svc]${RESET}       ${DIM}lint all (or one)${RESET}\n"
printf "  ${GREEN}typecheck [svc]${RESET}  ${DIM}type-check all (or one)${RESET}\n"
printf "  ${GREEN}test [svc]${RESET}       ${DIM}unit tests all (or one)${RESET}\n"
printf "  ${GREEN}e2e [svc]${RESET}        ${DIM}end-to-end (Playwright) all (or one)${RESET}\n"
printf "  ${GREEN}format${RESET}           ${DIM}format with Prettier (write)${RESET}\n"
printf "  ${GREEN}clean${RESET}            ${DIM}remove build output + caches${RESET}\n"
printf "\n${GREEN}${BOLD}── GATE (agents: run before 'done') ────${RESET}\n"
printf "  ${GREEN}verify [svc]${RESET}     ${DIM}lint + typecheck + build — the done-gate${RESET}\n"
printf "  ${GREEN}format-check${RESET}     ${DIM}Prettier check (no writes)${RESET}\n"
printf "\n${CYAN}${BOLD}── INFO ────────────────────────────────${RESET}\n"
printf "  ${GREEN}list-services${RESET}    ${DIM}list services in the monorepo${RESET}\n"
printf "\n${DIM}Services are named after Norse figures (see NAMING.md). First service: ${RESET}${GREEN}bragi${RESET} ${DIM}(website)${RESET}\n\n"
'''
dir = "{{config_root}}"

[tasks.setup]
description = "Install all dependencies + wire git hooks"
run = '''
    set -e

    BOLD="\033[1m"; RESET="\033[0m"; GREEN="\033[32m"; CYAN="\033[36m"; YELLOW="\033[33m"; DIM="\033[2m"
    TICK="${GREEN}✓${RESET}"; ARROW="${CYAN}→${RESET}"

    printf "\n${BOLD}Setting up Modules Platform...${RESET}\n\n"

    printf "${ARROW} ${CYAN}[1/2]${RESET} Installing Node dependencies\n"
    pnpm install --frozen-lockfile 2>&1 | tail -3 || pnpm install 2>&1 | tail -3
    printf "  ${TICK} Node dependencies ready\n\n"

    printf "${ARROW} ${CYAN}[2/2]${RESET} Wiring git hooks (husky)\n"
    pnpm exec husky 2>/dev/null || npx --no -- husky 2>/dev/null || true
    if [ -x .husky/pre-commit ]; then
      printf "  ${TICK} git hooks active (pre-commit, commit-msg, pre-push)\n\n"
    else
      printf "  ${YELLOW}! hooks not wired — check .husky/${RESET}\n\n"
    fi

    printf "${GREEN}${BOLD}✓ Setup complete!${RESET}\n\n"
    printf "${DIM}Next steps:${RESET}\n"
    printf "  ${YELLOW}mise run dev${RESET}       ${DIM}start all services${RESET}\n"
    printf "  ${YELLOW}mise run info${RESET}      ${DIM}see all tasks${RESET}\n\n"
'''
dir = "{{config_root}}"

# OPTIONAL + tool-specific: deliberately NOT part of `setup` (keep setup provider-neutral).
# Installs a recommended set of AI agent skills for whoever opts in. The Claude plugins
# are project-scoped (committed to .claude/settings.json, so Claude Code users auto-get
# them); graphify is a cross-tool CLI installed per-developer via uv.
[tasks.setup-agent-skills]
description = "OPTIONAL: install recommended agent skills (ponytail, superpowers, mattpocock, i-have-adhd, graphify)"
run = '''
    BOLD="\033[1m"; RESET="\033[0m"; GREEN="\033[32m"; CYAN="\033[36m"; YELLOW="\033[33m"; DIM="\033[2m"
    TICK="${GREEN}✓${RESET}"; ARROW="${CYAN}→${RESET}"

    printf "\n${BOLD}Installing recommended agent skills (optional)...${RESET}\n\n"

    # --- Claude Code plugins (project scope → .claude/settings.json) ---
    if command -v claude >/dev/null 2>&1; then
      printf "${ARROW} ${CYAN}Claude Code plugins${RESET}\n"
      claude plugin marketplace add DietrichGebert/ponytail --scope project >/dev/null 2>&1 || true
      claude plugin marketplace add ayghri/i-have-adhd --scope project >/dev/null 2>&1 || true
      for p in ponytail@ponytail superpowers@claude-plugins-official mattpocock-skills@claude-plugins-official i-have-adhd@i-have-adhd; do
        if claude plugin install "$p" --scope project >/dev/null 2>&1; then
          printf "  ${TICK} $p\n"
        else
          printf "  ${YELLOW}! $p (skipped)${RESET}\n"
        fi
      done
      printf "\n"
    else
      printf "${YELLOW}! 'claude' CLI not found — skipping Claude Code plugins${RESET}\n\n"
    fi

    # --- graphify (cross-tool CLI + /graphify skill; installs per-developer) ---
    # Swap --platform (claude|codex|cursor|gemini|opencode|…) for a different agent.
    if command -v uv >/dev/null 2>&1; then
      printf "${ARROW} ${CYAN}graphify${RESET} ${DIM}(uv tool, from Graphify-Labs)${RESET}\n"
      uv tool install "git+https://github.com/Graphify-Labs/graphify" >/dev/null 2>&1 \
        || uv tool upgrade graphifyy >/dev/null 2>&1 || true
      if graphify install --platform claude >/dev/null 2>&1; then
        printf "  ${TICK} graphify installed — type: ${YELLOW}/graphify .${RESET}\n\n"
      else
        printf "  ${YELLOW}! graphify install failed${RESET}\n\n"
      fi
    else
      printf "${YELLOW}! 'uv' not found — install uv for graphify (https://docs.astral.sh/uv)${RESET}\n\n"
    fi

    printf "${GREEN}${BOLD}✓ Agent skills done.${RESET} ${DIM}Restart your agent to load them.${RESET}\n\n"
'''
dir = "{{config_root}}"

[tasks.dev]
description = "Start dev servers — all services, or one: mise run dev <service>"
run = '''
#!/bin/bash
set -e
# dev servers are long-running; run all concurrently when no service is given.
if [ -n "$1" ]; then
  nx run "$1:dev"
else
  nx run-many --target=dev --all --parallel=100
fi
'''
dir = "{{config_root}}"

[tasks.build]
description = "Build all services (or one: mise run build <service>)"
run = '''
#!/bin/bash
set -e
if [ -n "$1" ]; then nx run "$1:build"; else nx run-many --target=build --all; fi
'''
dir = "{{config_root}}"

[tasks.lint]
description = "Lint all services (or one: mise run lint <service>)"
run = '''
#!/bin/bash
set -e
if [ -n "$1" ]; then nx run "$1:lint"; else nx run-many --target=lint --all; fi
'''
dir = "{{config_root}}"

[tasks.typecheck]
description = "Type-check all services (or one: mise run typecheck <service>)"
run = '''
#!/bin/bash
set -e
if [ -n "$1" ]; then nx run "$1:typecheck"; else nx run-many --target=typecheck --all; fi
'''
dir = "{{config_root}}"

[tasks.test]
description = "Unit tests all services (or one: mise run test <service>)"
run = '''
#!/bin/bash
set -e
# Tolerate services that have no `test` target yet (nx errors on unknown target).
if [ -n "$1" ]; then
  nx run "$1:test" 2>/dev/null || echo "note: no 'test' target for '$1' (unit tests not wired yet) — try: mise run e2e $1"
else
  nx run-many --target=test --all 2>/dev/null || echo "note: no 'test' targets found yet — try: mise run e2e"
fi
'''
dir = "{{config_root}}"

[tasks.e2e]
description = "End-to-end tests (Playwright) all services (or one: mise run e2e <service>)"
run = '''
#!/bin/bash
set -e
if [ -n "$1" ]; then nx run "$1:e2e"; else nx run-many --target=e2e --all; fi
'''
dir = "{{config_root}}"

[tasks.format]
description = "Format the repo with Prettier (writes changes)"
run = "prettier --write ."
dir = "{{config_root}}"

[tasks.format-check]
description = "Check formatting with Prettier (no writes)"
run = "prettier --check ."
dir = "{{config_root}}"

[tasks.verify]
description = "Done-gate: lint + typecheck + build (one service, or all). Run before declaring work complete."
run = '''
#!/bin/bash
set -e
BOLD="\033[1m"; RESET="\033[0m"; GREEN="\033[32m"
if [ -n "$1" ]; then
  nx run-many --target=lint,typecheck,build --projects="$1"
else
  nx run-many --target=lint,typecheck,build --all
fi
printf "\n${GREEN}${BOLD}✓ verify passed${RESET} ${GREEN}(lint + typecheck + build)${RESET}\n"
printf "  behavioral check: ${BOLD}mise run e2e${RESET} %s\n\n" "${1:-}"
'''
dir = "{{config_root}}"

[tasks.clean]
description = "Remove build output + caches"
run = '''
    rm -rf .nx node_modules/.cache
    find services -type d \( -name dist -o -name .astro \) -prune -exec rm -rf {} + 2>/dev/null || true
    echo "✓ cleaned"
'''
dir = "{{config_root}}"

[tasks.graph-update]
description = "Refresh the code-review-graph knowledge graph (no-op if the tool isn't installed)"
run = '''
#!/bin/bash
# Provider-neutral entry point for keeping the code graph fresh. Any tool, human,
# or CI calls the SAME command — not a Claude-only hook. Tolerant by design so a
# machine without code-review-graph installed still commits/pushes cleanly.
if command -v code-review-graph >/dev/null 2>&1; then
  code-review-graph update || true
elif command -v uvx >/dev/null 2>&1; then
  uvx code-review-graph update || true
else
  echo "note: code-review-graph not installed — skipping graph update"
fi
'''
dir = "{{config_root}}"

[tasks.list-services]
description = "List services in the monorepo"
run = '''
    GREEN="\033[32m"; RESET="\033[0m"; DIM="\033[2m"
    printf "\nServices:\n"
    for d in services/*/; do [ -f "$d/project.json" ] && printf "  ${GREEN}%s${RESET}\n" "$(basename "$d")"; done
    printf "\n"
'''
dir = "{{config_root}}"
