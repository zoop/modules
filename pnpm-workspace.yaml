packages:
  - "services/*"
  - "packages/*"
  - "tools/*"

# Allow these dependencies to run build scripts (pnpm 10+ blocks them by default).
onlyBuiltDependencies:
  - esbuild
  - nx
  - sharp

catalogs:
  # ============================================================================
  # Default Catalog - Shared across all packages (accessed via catalog:)
  # ============================================================================
  default:
    # Workspace tooling
    typescript: 5.9.2
    prettier: ^3.6.2
    eslint: ^9.38.0
    "@eslint/js": ^9.38.0
    typescript-eslint: ^8.18.0
    eslint-plugin-astro: ^1.3.1
    "@types/node": ^24.0.0

    # Build tools
    vite: ^6.0.5
    vitest: ^2.1.8
    tailwindcss: ^4.1.16
    "@tailwindcss/vite": ^4.1.16

    # E2E Testing
    "@playwright/test": ^1.57.0

  # ============================================================================
  # Astro Catalog (accessed via catalog:astro)
  # ============================================================================
  astro:
    astro: ^6.0.8
    "@astrojs/react": ^5.0.1

  # ============================================================================
  # React 19 Catalog (accessed via catalog:react19)
  # ============================================================================
  react19:
    react: 19.2.0
    react-dom: 19.2.0
    "@types/react": 19.2.9
    "@types/react-dom": 19.1.1
